name: Scheduled Cron Workflow

on:
  schedule:
    - cron: '*/5 * * * *'
  # Adding workflow_dispatch allows you to manually trigger it instantly
  # without waiting 15–20 minutes for GitHub's scheduler to queue it up.
  workflow_dispatch:

jobs:
  hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: Echo current time
        run: echo "The current server time is $(date)"